name: Automated Preprocessing Pipeline

on:
  push:
    paths:
      - 'la-liga-2014-2020_raw/**'
      - 'preprocessing/**'
  workflow_dispatch:

jobs:
  build-and-preprocess:
    runs-on: ubuntu-latest
    permissions:
      contents: write


    steps:
    - name: 1. Checkout repository
      uses: actions/checkout@v4

    - name: 2. Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 3. Install Library Yang Dibutuhkan
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn

    - name: 4. Jalankan script preprocessing
      run: |
        python preprocessing/automate_Taufik_P.py --input_dir la-liga-2014-2020_raw/combined_data_laliga.csv --output la-liga-2014-2020_preprocessing/la_liga_cleaned.csv
    
    - name: 5. Commit dan Push Dataset terbaru ke Repository
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        git add preprocessing/la-liga-2014-2020_preprocessing/la_liga_cleaned.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "bot: auto-update dataset bersih dari GitHub Actions" && git push)