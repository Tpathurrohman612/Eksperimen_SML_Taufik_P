name: Automated Preprocessing Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-preprocess:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout repository
      uses: actions/checkout@v4

    - name: 2. Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 3. Install Library Yang Dibutuhkan
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn

    - name: 4. Jalankan script preprocessing
      run: |
        python preprocessing/automate_Taufik_P.py --input la-liga-2014-2020_raw/combined_data_laliga.csv --output la-liga-2014-2020_preprocessing/la_liga_cleaned.csv
    
    - name: 5. Upload Clean Dataset as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: clean-dataset-artifact
        path: la-liga-2014-2020_preprocessing/la_liga_cleaned.csv